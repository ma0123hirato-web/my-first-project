<style>
:root{--mocha:#B8977E;--mocha-d:#9A7A63;--mocha-l:#D4B99E;--bg:#FAF8F5;--dark:#2E2A27;--dark-nav:#1C1917;--mid:#6B5B4E;--soft:#EDE6DC;--white:#fff;--line:rgba(184,151,126,0.2);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--dark);font-weight:300;}
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 2.5rem;background:rgba(28,25,23,0.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:400;color:#fff;letter-spacing:0.1em;text-decoration:none;}
.nav-back{font-size:0.65rem;letter-spacing:0.18em;color:rgba(255,255,255,0.7);text-decoration:none;display:flex;align-items:center;gap:0.5rem;}
.nav-back::before{content:'←';}
.nav-back:hover{color:#fff;}
.page-wrap{max-width:760px;margin:0 auto;padding:120px 2.5rem 6rem;}
.breadcrumb{font-size:0.6rem;letter-spacing:0.2em;color:var(--mocha-d);margin-bottom:2.5rem;display:flex;align-items:center;gap:0.6rem;}
.breadcrumb a{color:var(--mocha-d);text-decoration:none;}
.breadcrumb span{color:var(--mid);}
.news-meta{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;}
.news-date{font-family:'Cormorant Garamond',serif;font-size:0.9rem;color:var(--mid);}
.news-tag{font-size:0.56rem;letter-spacing:0.13em;padding:0.18rem 0.7rem;border:1px solid var(--mocha);color:var(--mocha);}
.news-ttl{font-family:'Noto Serif JP',serif;font-size:clamp(1.2rem,2.5vw,1.8rem);font-weight:300;color:var(--dark);letter-spacing:0.08em;line-height:1.7;margin-bottom:2.5rem;padding-bottom:2rem;border-bottom:1px solid var(--line);}
.news-hero-img{width:100%;aspect-ratio:16/9;overflow:hidden;margin-bottom:3rem;background:linear-gradient(145deg,#7A8070,#5E6558);display:flex;align-items:center;justify-content:center;}
.news-hero-img span{font-size:0.65rem;letter-spacing:0.2em;color:rgba(255,255,255,0.5);}
.news-hero-img img{width:100%;height:100%;object-fit:cover;display:block;}
.news-body{font-family:'Noto Serif JP',serif;font-size:0.88rem;font-weight:300;color:var(--dark);line-height:2.6;letter-spacing:0.06em;margin-bottom:3rem;}
.news-body p{margin-bottom:1.4em;}
.news-body h3{font-size:1rem;font-weight:400;margin:2em 0 0.8em;padding-left:1em;border-left:2px solid var(--mocha);}
.news-img-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:2em 0;}
.news-img-slot{aspect-ratio:4/3;background:var(--soft);border:1px dashed rgba(184,151,126,0.4);display:flex;align-items:center;justify-content:center;}
.news-img-slot img{width:100%;height:100%;object-fit:cover;display:block;}
.news-img-slot span{font-size:0.58rem;letter-spacing:0.12em;color:rgba(184,151,126,0.5);}
.back-link{display:inline-flex;align-items:center;gap:0.6rem;font-size:0.65rem;letter-spacing:0.2em;color:var(--mocha-d);text-decoration:none;border-bottom:1px solid rgba(155,122,99,0.3);padding-bottom:2px;}
.back-link::before{content:'←';}
.back-link:hover{color:var(--mocha);}
</style>
</head>

</body>

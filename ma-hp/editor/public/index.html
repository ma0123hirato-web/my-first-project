<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式会社ma HP 編集アプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --mocha: #B8977E;
  --mocha-d: #9A7A63;
  --mocha-l: #D4B99E;
  --bg: #FAF8F5;
  --dark: #2E2A27;
  --mid: #6B5B4E;
  --soft: #EDE6DC;
  --border: #D9CFC6;
  --white: #fff;
  --success: #4CAF50;
  --error: #E53935;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--dark); font-size: 14px; }

/* ── NAV ── */
#app-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 52px; background: var(--dark); color: var(--white);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.5rem;
}
.nav-title { font-size: 0.9rem; font-weight: 500; letter-spacing: 0.05em; }
.nav-brand { color: var(--mocha-l); font-weight: 300; margin-right: 0.5rem; }
.nav-actions { display: flex; gap: 0.75rem; align-items: center; }
.btn { cursor: pointer; border: none; font-family: inherit; font-size: 0.8rem; border-radius: 3px; transition: all 0.2s; padding: 0.45rem 1rem; letter-spacing: 0.04em; }
.btn-primary { background: var(--mocha); color: var(--white); }
.btn-primary:hover { background: var(--mocha-d); }
.btn-secondary { background: transparent; color: var(--white); border: 1px solid rgba(255,255,255,0.35); }
.btn-secondary:hover { background: rgba(255,255,255,0.1); }
.btn-ghost { background: transparent; color: var(--mocha-l); border: none; text-decoration: underline; font-size: 0.78rem; padding: 0.4rem 0.6rem; }
.btn-ghost:hover { color: var(--white); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ── LAYOUT ── */
#app-body {
  display: flex;
  padding-top: 52px;
  height: 100vh;
}
#left-panel {
  width: 420px;
  min-width: 320px;
  max-width: 480px;
  height: 100%;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--white);
  overflow: hidden;
}
#right-panel {
  flex: 1;
  height: 100%;
  background: #E8E4DC;
  display: flex;
  flex-direction: column;
}

/* ── TABS ── */
#tab-bar {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--soft);
  flex-shrink: 0;
}
.tab-btn {
  flex: 1;
  padding: 0.85rem 0.5rem;
  border: none;
  background: transparent;
  font-family: inherit;
  font-size: 0.78rem;
  color: var(--mid);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  letter-spacing: 0.04em;
}
.tab-btn.active {
  color: var(--mocha-d);
  border-bottom-color: var(--mocha);
  background: var(--white);
  font-weight: 500;
}
.tab-btn:hover:not(.active) { background: rgba(184,151,126,0.08); }

/* ── FORM AREA ── */
#form-area {
  flex: 1;
  overflow-y: auto;
  padding: 1rem 1.25rem 2rem;
}
.form-status {
  padding: 0.6rem 0.75rem;
  margin-bottom: 0.75rem;
  border-radius: 3px;
  font-size: 0.78rem;
  display: none;
}
.form-status.loading { display: block; background: #FFF8F0; color: var(--mid); border: 1px solid var(--mocha-l); }
.form-status.error { display: block; background: #FFF0F0; color: var(--error); border: 1px solid #FFCDD2; }
.form-status.success { display: block; background: #F0FFF4; color: #2E7D32; border: 1px solid #C8E6C9; }

.section-label {
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: var(--mocha);
  font-weight: 500;
  text-transform: uppercase;
  padding: 1.2rem 0 0.5rem;
  border-bottom: 1px solid var(--soft);
  margin-bottom: 0.75rem;
}
.section-label:first-child { padding-top: 0.25rem; }

.field-group { margin-bottom: 0.9rem; }
.field-label {
  display: block;
  font-size: 0.72rem;
  color: var(--mid);
  margin-bottom: 0.3rem;
  font-weight: 400;
}
.field-input, .field-textarea, .field-url {
  width: 100%;
  font-family: inherit;
  font-size: 0.82rem;
  color: var(--dark);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 0.45rem 0.6rem;
  transition: border-color 0.2s;
  line-height: 1.5;
}
.field-input:focus, .field-textarea:focus, .field-url:focus {
  outline: none;
  border-color: var(--mocha);
  background: var(--white);
}
.field-textarea { resize: vertical; min-height: 72px; }
.field-url { font-size: 0.76rem; color: var(--mid); }
.field-not-found {
  font-size: 0.72rem;
  color: #aaa;
  font-style: italic;
  padding: 0.3rem 0;
}

.card-group {
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.75rem;
  margin-bottom: 0.75rem;
  background: var(--bg);
}
.card-group-title {
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--mocha-d);
  margin-bottom: 0.6rem;
  letter-spacing: 0.06em;
}

/* ── PREVIEW ── */
#preview-toolbar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.6rem 1rem;
  background: rgba(42,37,32,0.06);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#preview-label {
  font-size: 0.7rem;
  color: var(--mid);
  letter-spacing: 0.1em;
  flex: 1;
}
.btn-preview { background: var(--mocha); color: var(--white); font-size: 0.75rem; padding: 0.35rem 0.9rem; }
.btn-preview:hover { background: var(--mocha-d); }
#preview-frame {
  flex: 1;
  width: 100%;
  border: none;
  background: var(--white);
}

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  padding: 0.75rem 1.25rem;
  background: var(--dark);
  color: var(--white);
  border-radius: 4px;
  font-size: 0.82rem;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.3s;
  pointer-events: none;
  z-index: 999;
  max-width: 300px;
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.success { background: #2E7D32; }
#toast.error { background: var(--error); }

// ────────────────────────────────────────────────────────────
// DOM helpers
// ────────────────────────────────────────────────────────────
function resolveElement(doc, selector, nth) {
  const selectors = selector.split(',').map(s => s.trim());
  for (const sel of selectors) {
    try {
      const els = doc.querySelectorAll(sel);
      if (els.length > 0) {
        const idx = nth !== undefined ? nth : 0;
        if (els[idx]) return els[idx];
        if (nth === undefined && els[0]) return els[0];
      }
    } catch(e) { /* ignore bad selectors */ }
  }
  return null;
}

function getElementValue(el, prop) {
  if (!el) return '';
  if (prop === 'style.backgroundImage') {
    const v = el.style.backgroundImage || '';
    return v.replace(/^url\(['"]?/, '').replace(/['"]?\)$/, '');
  }
  if (prop === 'src') return el.src || el.getAttribute('src') || '';
  if (prop === 'href') return el.href || el.getAttribute('href') || '';
  if (prop === 'textContent') return (el.textContent || '').trim();
  if (prop === 'innerHTML') return el.innerHTML || '';
  return '';
}

function setElementValue(el, prop, value) {
  if (!el) return;
  if (prop === 'style.backgroundImage') {
    el.style.backgroundImage = value ? `url('${value}')` : '';
    return;
  }
  if (prop === 'src') { el.setAttribute('src', value); return; }
  if (prop === 'href') { el.setAttribute('href', value); return; }
  if (prop === 'textContent') { el.textContent = value; return; }
  if (prop === 'innerHTML') { el.innerHTML = value; return; }
}

// ────────────────────────────────────────────────────────────
// Build form
// ────────────────────────────────────────────────────────────
function buildForm(pageName, doc) {
  const pageDef = PAGES[pageName];
  const container = document.getElementById('form-fields');
  container.innerHTML = '';

  pageDef.sections.forEach(section => {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = section.title;
    container.appendChild(lbl);

    section.fields.forEach(field => {
      const el = resolveElement(doc, field.selector, field.nth);
      const value = getElementValue(el, field.prop);

      const group = document.createElement('div');
      group.className = 'field-group';

      const label = document.createElement('label');
      label.className = 'field-label';
      label.htmlFor = 'f_' + field.id;
      label.textContent = field.label;
      if (!el) label.style.opacity = '0.5';
      group.appendChild(label);

      if (!el) {
        const note = document.createElement('div');
        note.className = 'field-not-found';
        note.textContent = '（この要素はHTMLに見つかりませんでした）';
        group.appendChild(note);
      } else {
        let input;
        if (field.type === 'textarea') {
          input = document.createElement('textarea');
          input.className = 'field-textarea';
          input.rows = 3;
        } else {
          input = document.createElement('input');
          input.type = 'text';
          input.className = field.type === 'url' ? 'field-url' : 'field-input';
        }
        input.id = 'f_' + field.id;
        input.value = value;
        input.dataset.selector = field.selector;
        input.dataset.prop = field.prop;
        if (field.nth !== undefined) input.dataset.nth = field.nth;
        group.appendChild(input);
      }

      container.appendChild(group);
    });
  });
}

// ────────────────────────────────────────────────────────────
// Apply form values to DOM
// ────────────────────────────────────────────────────────────
function applyFormToDoc(doc) {
  const inputs = document.querySelectorAll('#form-fields [data-selector]');
  inputs.forEach(input => {
    const selector = input.dataset.selector;
    const prop = input.dataset.prop;
    const nth = input.dataset.nth !== undefined ? parseInt(input.dataset.nth) : undefined;
    const el = resolveElement(doc, selector, nth);
    if (el) setElementValue(el, prop, input.value);
  });
}

// ────────────────────────────────────────────────────────────
// Preview
// ────────────────────────────────────────────────────────────
function updatePreview() {
  if (!currentDoc) return;
  applyFormToDoc(currentDoc);
  const html = '<!DOCTYPE html>' + currentDoc.documentElement.outerHTML;
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  document.getElementById('preview-frame').src = blobUrl;
}

// ────────────────────────────────────────────────────────────
// Load page
// ────────────────────────────────────────────────────────────
async function loadPage(pageName) {
  const statusEl = document.getElementById('form-status');
  statusEl.className = 'form-status loading';
  statusEl.textContent = 'ファイルを読み込み中...';
  document.getElementById('form-fields').innerHTML = '';

  try {
    const res = await fetch(`/api/file?name=${pageName}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    const parser = new DOMParser();
    currentDoc = parser.parseFromString(data.content, 'text/html');
    currentPage = pageName;

    buildForm(pageName, currentDoc);
    statusEl.style.display = 'none';
    updatePreview();
  } catch (err) {
    statusEl.className = 'form-status error';
    statusEl.textContent = `読み込みエラー: ${err.message}`;
  }
}

// ────────────────────────────────────────────────────────────
// Save
// ────────────────────────────────────────────────────────────
async function saveFile() {
  if (!currentDoc) return;
  applyFormToDoc(currentDoc);
  const html = '<!DOCTYPE html>' + currentDoc.documentElement.outerHTML;

  try {
    const res = await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: currentPage, content: html })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Unknown error');
    showToast(data.message || '保存しました。', 'success');
  } catch (err) {
    showToast(`保存失敗: ${err.message}`, 'error');
  }
}

// ────────────────────────────────────────────────────────────
// Download
// ────────────────────────────────────────────────────────────
function downloadFile() {
  if (!currentDoc) return;
  applyFormToDoc(currentDoc);
  const html = '<!DOCTYPE html>' + currentDoc.documentElement.outerHTML;
  const a = document.createElement('a');
  const fileNames = { index: 'index.html', nini: 'nini.html', event: 'event-modelhouse.html' };
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = fileNames[currentPage] || 'page.html';
  a.click();
  showToast(`${a.download} をダウンロードしました。`);
}

// ────────────────────────────────────────────────────────────
// Tab switch
// ────────────────────────────────────────────────────────────
function switchTab(pageName, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadPage(pageName);
}

// ────────────────────────────────────────────────────────────
// Toast
// ────────────────────────────────────────────────────────────
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' ' + type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ''; }, 3000);
}

// ────────────────────────────────────────────────────────────
// Init
// ────────────────────────────────────────────────────────────
loadPage('index');
</script>

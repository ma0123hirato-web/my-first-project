<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA HP Editor</title>
<style>
:root{
  --mocha:#B8977E;--mocha-d:#9A7A63;--mocha-l:#D4B99E;
  --bg:#1A1714;--panel:#232019;--card:#2C2824;--border:rgba(184,151,126,0.18);
  --text:#E8E0D6;--muted:rgba(232,224,214,0.5);--white:#fff;
  --ok:#4CAF50;--ng:#E57373;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;background:var(--bg);color:var(--text);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* top bar */
#topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;flex-shrink:0;}
#topbar h1{font-size:13px;font-weight:600;letter-spacing:0.1em;color:var(--mocha-l);margin-right:auto;}
#btn-open{padding:6px 14px;background:var(--mocha);color:#1A1714;border:none;cursor:pointer;font-size:11px;letter-spacing:0.1em;font-weight:600;border-radius:2px;}
#btn-open:hover{background:var(--mocha-l);}
#dir-label{font-size:11px;color:var(--muted);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#preview-mode{display:flex;gap:6px;align-items:center;}
#preview-mode span{font-size:10px;color:var(--muted);}
.pv-btn{padding:4px 10px;background:var(--card);color:var(--muted);border:1px solid var(--border);cursor:pointer;font-size:10px;border-radius:2px;}
.pv-btn.active{background:var(--mocha);color:#1A1714;border-color:var(--mocha);}

/* tabs */
#tabbar{height:38px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:flex-end;padding:0 12px;gap:2px;flex-shrink:0;overflow-x:auto;}
#tabbar::-webkit-scrollbar{height:3px;}
#tabbar::-webkit-scrollbar-track{background:transparent;}
#tabbar::-webkit-scrollbar-thumb{background:var(--border);}
.tab-btn{padding:6px 14px;background:transparent;color:var(--muted);border:none;cursor:pointer;font-size:11px;letter-spacing:0.08em;border-bottom:2px solid transparent;white-space:nowrap;transition:color 0.2s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--mocha-l);border-bottom-color:var(--mocha);}

/* main layout */
#main{flex:1;display:flex;overflow:hidden;}

/* form panel */
#form-panel{width:360px;flex-shrink:0;overflow-y:auto;border-right:1px solid var(--border);padding:0;}
#form-panel::-webkit-scrollbar{width:4px;}
#form-panel::-webkit-scrollbar-track{background:transparent;}
#form-panel::-webkit-scrollbar-thumb{background:var(--border);}

.section-hd{padding:10px 16px 6px;font-size:10px;letter-spacing:0.18em;color:var(--mocha-d);background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
.field{padding:10px 16px;border-bottom:1px solid rgba(184,151,126,0.08);}
.field-label{font-size:10px;letter-spacing:0.1em;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.field input[type=text],.field textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 10px;font-size:12px;border-radius:2px;font-family:inherit;}
.field textarea{resize:vertical;min-height:60px;line-height:1.6;}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--mocha);}

/* font size control */
.fs-row{display:flex;align-items:center;gap:6px;}
.fs-row input{flex:1;}
.fs-btn{padding:4px 10px;background:var(--card);color:var(--mocha-l);border:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:600;border-radius:2px;line-height:1;}
.fs-btn:hover{background:var(--mocha);color:#1A1714;}

/* image upload */
.img-upload-area{border:1px dashed var(--border);padding:10px;border-radius:2px;background:var(--card);cursor:pointer;text-align:center;transition:border-color 0.2s;}
.img-upload-area:hover{border-color:var(--mocha);}
.img-upload-area.has-img{border-style:solid;border-color:var(--mocha-d);}
.img-preview{width:100%;height:80px;object-fit:cover;display:block;margin-bottom:6px;border-radius:1px;}
.img-hint{font-size:10px;color:var(--muted);letter-spacing:0.1em;}
.img-pos{display:flex;gap:4px;margin-top:6px;}
.pos-btn{flex:1;padding:3px 0;background:var(--panel);color:var(--muted);border:1px solid var(--border);cursor:pointer;font-size:10px;border-radius:2px;}
.pos-btn.active{background:var(--mocha-d);color:var(--white);border-color:var(--mocha-d);}

/* toggle */
.toggle-row{display:flex;align-items:center;gap:10px;}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:#555;border-radius:12px;cursor:pointer;transition:0.2s;}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:0.2s;}
.toggle input:checked+.toggle-slider{background:var(--mocha);}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px);}
.toggle-label{font-size:12px;color:var(--text);}

/* note field */
.field-note{font-size:11px;color:var(--muted);line-height:1.6;padding:8px 12px;background:var(--card);border-radius:2px;border-left:2px solid var(--mocha-d);}

/* inline font size mini buttons */
.fs-mini{margin-left:auto;display:flex;gap:3px;}
.fs-mini-btn{padding:1px 6px;background:var(--card);color:var(--mocha-l);border:1px solid var(--border);cursor:pointer;font-size:10px;font-weight:600;border-radius:2px;line-height:1.4;}
.fs-mini-btn:hover{background:var(--mocha);color:#1A1714;}
.field-label{display:flex;align-items:center;gap:4px;}

/* save button */
#save-bar{padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;}
#btn-save{width:100%;padding:10px;background:var(--mocha);color:#1A1714;border:none;cursor:pointer;font-size:12px;font-weight:700;letter-spacing:0.15em;border-radius:2px;transition:background 0.2s;}
#btn-save:hover{background:var(--mocha-l);}
#btn-save:disabled{background:#555;color:#888;cursor:not-allowed;}

/* iframe preview */
#preview-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#111;}
#preview-wrap{flex:1;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;padding:16px;}
#preview-iframe{border:none;background:#fff;transition:width 0.3s;}
#preview-iframe.pc{width:100%;height:100%;}
#preview-iframe.sp{width:390px;height:844px;box-shadow:0 0 0 8px #222;border-radius:8px;}

/* toast */
#toast{position:fixed;bottom:24px;right:24px;background:var(--ok);color:#fff;padding:10px 20px;border-radius:4px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity 0.3s;z-index:999;}
#toast.show{opacity:1;}
#toast.err{background:var(--ng);}

/* works special */
.wk-accordion{border:1px solid var(--border);border-radius:2px;margin-bottom:8px;overflow:hidden;}
.wk-acc-hd{padding:8px 12px;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:12px;}
.wk-acc-hd:hover{background:var(--panel);}
.wk-acc-arrow{color:var(--mocha);font-size:14px;transition:transform 0.2s;}
.wk-acc-body{display:none;padding:10px 12px;background:var(--bg);border-top:1px solid var(--border);}
.wk-acc-body.open{display:block;}
.wk-field{margin-bottom:8px;}
.wk-field label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px;}
.wk-field input,.wk-field textarea,.wk-field select{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:5px 8px;font-size:11px;border-radius:2px;font-family:inherit;}
.wk-field textarea{resize:vertical;min-height:50px;}
.spec-row{display:flex;gap:6px;margin-bottom:4px;align-items:center;}
.spec-row input{flex:1;}
.spec-del{padding:3px 7px;background:var(--ng);color:#fff;border:none;cursor:pointer;border-radius:2px;font-size:11px;}
.spec-add{padding:4px 10px;background:var(--card);color:var(--mocha-l);border:1px solid var(--border);cursor:pointer;font-size:10px;border-radius:2px;margin-top:4px;}
.wk-img-area{border:1px dashed var(--border);padding:8px;border-radius:2px;background:var(--card);cursor:pointer;text-align:center;}
.wk-img-area:hover{border-color:var(--mocha);}
.wk-img-area.has-img{border-style:solid;border-color:var(--mocha-d);}
.wk-img-preview{width:100%;height:60px;object-fit:cover;display:block;margin-bottom:4px;}
</style>
</head>
<body>

<div id="topbar">
  <h1>MA HP EDITOR</h1>
  <span id="dir-label">フォルダを開いてください</span>
  <div id="preview-mode">
    <span>プレビュー</span>
    <button class="pv-btn active" id="pv-pc" onclick="setPv('pc')">PC</button>
    <button class="pv-btn" id="pv-sp" onclick="setPv('sp')">SP</button>

  <button id="btn-open" onclick="openDir()">フォルダを開く</button>
</div>

<div id="tabbar">

  <button class="tab-btn" onclick="switchTab('service')">サービス</button>
  <button class="tab-btn" onclick="switchTab('events')">イベント一覧</button>
  <button class="tab-btn" onclick="switchTab('ev1')">イベント①</button>

  <button class="tab-btn" onclick="switchTab('ev5')">イベント⑤</button>
  <button class="tab-btn" onclick="switchTab('ev6')">イベント⑥</button>
  <button class="tab-btn" onclick="switchTab('ns1')">お知らせ①</button>
  <button class="tab-btn" onclick="switchTab('ns2')">お知らせ②</button>
  <button class="tab-btn" onclick="switchTab('ns3')">お知らせ③</button>
</div>

<div id="main">
  <div id="form-panel">
    <div id="fields-container"></div>
    <div id="save-bar">
      <button id="btn-save" onclick="saveFile()" disabled>保存する</button>
    </div>
  </div>
  <div id="preview-pane">
    <div id="preview-wrap">
      <iframe id="preview-iframe" class="pc"></iframe>
    </div>
  </div>
</div>

<div id="toast"></div>

// ── State ─────────────────────────────────────────────────────────────────────
let dirHandle = null;
let curTab = 'index';
let curDoc = null;       // parsed DOMParser document
let curRaw = '';         // original file text
let imgStore = {};       // fid → dataUrl
let posStore = {};       // fid → 'top'|'center'|'bottom'
let visStore = {};       // fid → bool (true=visible)
let fsStore = {};        // fid → string e.g. "1.2rem"
let worksData = null;    // parsed works array
let worksImgs = {};      // "wi_N_M" → dataUrl (work N, photo M)

// ── Open directory ─────────────────────────────────────────────────────────────
async function openDir() {
  try {
    dirHandle = await window.showDirectoryPicker({mode:'readwrite'});
    document.getElementById('dir-label').textContent = dirHandle.name;
    document.getElementById('btn-save').disabled = false;
    await loadTab(curTab);
  } catch(e) {
    if(e.name !== 'AbortError') showToast('フォルダを開けませんでした', true);
  }
}

// ── Tab switching ──────────────────────────────────────────────────────────────
function switchTab(key) {
  curTab = key;
  document.querySelectorAll('.tab-btn').forEach((b,i) => {
    const keys = ['index','nini','works','service','events','ev1','ev2','ev3','ev4','ev5','ev6','ns1','ns2','ns3'];
    b.classList.toggle('active', keys[i] === key);
  });
  if(dirHandle) loadTab(key);
  else renderFields(key);
}

async function loadTab(key) {
  if(key === 'works') {
    await loadWorks();
    return;
  }
  const fname = FM[key];
  if(!fname) return;
  try {
    const fh = await dirHandle.getFileHandle(fname);
    const file = await fh.getFile();
    curRaw = await file.text();
    const parser = new DOMParser();
    curDoc = parser.parseFromString(curRaw, 'text/html');
    imgStore = {};
    posStore = {};
    visStore = {};
    fsStore = {};
    renderFields(key);
    updatePreview();
  } catch(e) {
    showToast('ファイルを読み込めませんでした: ' + e.message, true);
  }
}

// ── Render fields ─────────────────────────────────────────────────────────────
function renderFields(key) {
  const container = document.getElementById('fields-container');
  if(key === 'works') return; // handled by loadWorks
  const defs = FIELDS[key];
  if(!defs) { container.innerHTML = '<div class="field"><p class="field-note">このページは対応していません。</p></div>'; return; }

  let html = '';
  for(const f of defs) {
    if(f.sec !== undefined) {
      html += `<div class="section-hd">${f.sec}</div>`;
      continue;
    }
    html += renderField(f);
  }
  container.innerHTML = html;

  // attach handlers after render
  for(const f of defs) {
    if(!f.id) continue;
    if(f.type === 'input' || f.type === 'textarea') attachTextHandler(f);
    else if(f.type === 'image') attachImageHandler(f);
    else if(f.type === 'toggle') attachToggleHandler(f);
    else if(f.type === 'fs') attachFsHandler(f);
  }
}

function renderField(f) {
  if(f.type === 'note') {
    return `<div class="field"><p class="field-note">${f.text}</p></div>`;
  }
  const val = getFieldValue(f);
  const selQ = f.sel ? f.sel.replace(/\\/g,'\\\\').replace(/'/g,"\\'") : '';
  const fsBtn = selQ ? `<span class="fs-mini"><button class="fs-mini-btn" onclick="adjFsDirect('${selQ}',-0.05)">A-</button><button class="fs-mini-btn" onclick="adjFsDirect('${selQ}',+0.05)">A+</button></span>` : '';
  if(f.type === 'input') {
    return `<div class="field"><div class="field-label">${f.lbl}${fsBtn}</div>
      <input type="text" id="${f.id}" value="${esc(val)}"></div>`;
  }
  if(f.type === 'textarea') {
    return `<div class="field"><div class="field-label">${f.lbl}${fsBtn}</div>
      <textarea id="${f.id}">${esc(val)}</textarea></div>`;
  }
  if(f.type === 'fs') {
    const fv = getFontSize(f);
    return `<div class="field"><div class="field-label">${f.lbl}</div>
      <div class="fs-row">
        <input type="text" id="${f.id}" value="${esc(fv)}" placeholder="例: 1rem">
        <button class="fs-btn" onclick="adjFs('${f.id}', ${f.sel ? `'${f.sel}'` : 'null'}, -0.05)">A-</button>
        <button class="fs-btn" onclick="adjFs('${f.id}', ${f.sel ? `'${f.sel}'` : 'null'}, +0.05)">A+</button>
      </div></div>`;
  }
  if(f.type === 'image') {
    const pos = posStore[f.id] || 'center';
    return `<div class="field"><div class="field-label">${f.lbl}</div>
      <div class="img-upload-area" id="${f.id}-area" onclick="triggerImgUpload('${f.id}')">
        <img id="${f.id}-preview" class="img-preview" style="display:none" src="">
        <p class="img-hint" id="${f.id}-hint">クリックして画像を選択</p>
      </div>
      <div class="img-pos">
        <button class="pos-btn ${pos==='top'?'active':''}" id="${f.id}-pt" onclick="setPos('${f.id}','top')">上</button>
        <button class="pos-btn ${pos==='center'?'active':''}" id="${f.id}-pc" onclick="setPos('${f.id}','center')">中央</button>
        <button class="pos-btn ${pos==='bottom'?'active':''}" id="${f.id}-pb" onclick="setPos('${f.id}','bottom')">下</button>
      </div></div>`;
  }
  if(f.type === 'toggle') {
    const visible = getVisibility(f);
    return `<div class="field"><div class="field-label">${f.lbl}</div>
      <div class="toggle-row">
        <label class="toggle"><input type="checkbox" id="${f.id}" ${visible?'checked':''}><span class="toggle-slider"></span></label>
        <span class="toggle-label" id="${f.id}-lbl">${visible?'表示中':'非表示'}</span>
      </div></div>`;
  }
  return '';
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Get field value from parsed doc ──────────────────────────────────────────
function getFieldValue(f) {
  if(!curDoc) return '';
  const el = curDoc.querySelector(f.sel);
  if(!el) return '';
  return el.textContent.trim();
}

function getFontSize(f) {
  if(!curDoc) return '';
  const el = curDoc.querySelector(f.sel);
  if(!el) return '';
  return el.style.fontSize || '';
}

function getVisibility(f) {
  if(!curDoc) return true;
  const el = curDoc.querySelector(f.sel);
  if(!el) return true;
  return el.style.display !== 'none';
}

// ── Attach input handlers ─────────────────────────────────────────────────────
function attachTextHandler(f) {
  const el = document.getElementById(f.id);
  if(!el) return;
  el.addEventListener('input', () => {
    if(!curDoc) return;
    const target = curDoc.querySelector(f.sel);
    if(target) target.textContent = el.value;
    schedulePreview();
  });
}

function attachToggleHandler(f) {
  const el = document.getElementById(f.id);
  if(!el) return;
  el.addEventListener('change', () => {
    if(!curDoc) return;
    const target = curDoc.querySelector(f.sel);
    if(target) target.style.display = el.checked ? '' : 'none';
    document.getElementById(f.id+'-lbl').textContent = el.checked ? '表示中' : '非表示';
    schedulePreview();
  });
}

function attachFsHandler(f) {
  const el = document.getElementById(f.id);
  if(!el) return;
  el.addEventListener('input', () => {
    if(!curDoc) return;
    const target = curDoc.querySelector(f.sel);
    if(target) target.style.fontSize = el.value;
    schedulePreview();
  });
}

function attachImageHandler(f) {
  // image handled via triggerImgUpload
}

// ── Font size adjust ──────────────────────────────────────────────────────────
function adjFs(fid, sel, delta) {
  const el = document.getElementById(fid);
  if(!el) return;
  let val = el.value.trim();
  let unit = 'rem';
  if(val.endsWith('px')) unit = 'px';
  else if(val.endsWith('em')) unit = 'em';
  let num = parseFloat(val) || 1;
  num = Math.round((num + delta) * 100) / 100;
  if(num < 0.1) num = 0.1;
  el.value = num + unit;
  el.dispatchEvent(new Event('input'));
}

function adjFsDirect(sel, delta) {
  if(!curDoc) return;
  const el = curDoc.querySelector(sel);
  if(!el) return;
  let fs = el.style.fontSize;
  if(!fs) {
    // default: read from computed or assume 1rem
    fs = '1rem';
  }
  let unit = 'rem';
  if(fs.endsWith('px')) unit = 'px';
  else if(fs.endsWith('em')) unit = 'em';
  let num = parseFloat(fs) || 1;
  num = Math.round((num + delta) * 100) / 100;
  if(num < 0.1) num = 0.1;
  el.style.fontSize = num + unit;
  schedulePreview();
}

// ── Image upload ──────────────────────────────────────────────────────────────
function triggerImgUpload(fid) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const dataUrl = ev.target.result;
      imgStore[fid] = dataUrl;
      const prev = document.getElementById(fid+'-preview');
      const hint = document.getElementById(fid+'-hint');
      const area = document.getElementById(fid+'-area');
      if(prev){ prev.src = dataUrl; prev.style.display='block'; }
      if(hint) hint.style.display='none';
      if(area) area.classList.add('has-img');
      applyImageToDoc(fid);
      schedulePreview();
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function applyImageToDoc(fid) {
  if(!curDoc) return;
  const defs = FIELDS[curTab];
  if(!defs) return;
  const f = defs.find(d=>d.id===fid);
  if(!f) return;
  const dataUrl = imgStore[fid];
  if(!dataUrl) return;
  const el = curDoc.querySelector(f.sel);
  if(!el) return;
  const pos = posStore[fid] || 'center';
  const posMap = {top:'top center', center:'center center', bottom:'bottom center'};
  if(f.prop === 'bg') {
    el.style.backgroundImage = `url(${dataUrl})`;
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = posMap[pos];
    el.style.backgroundRepeat = 'no-repeat';
  } else {
    let img;
    if(el.tagName && el.tagName.toLowerCase() === 'img') {
      img = el;
    } else {
      img = el.querySelector('img');
      if(!img) { img = curDoc.createElement('img'); el.appendChild(img); }
    }
    img.src = dataUrl;
    if(el !== img) {
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.display = 'block';
    }
    img.style.objectFit = 'cover';
    img.style.objectPosition = posMap[pos];
    // Hide all sibling elements (placeholder divs, hint spans, etc.)
    Array.from(el.children).forEach(child => { if(child !== img) child.style.display = 'none'; });
  }
}

function setPos(fid, pos) {
  posStore[fid] = pos;
  ['top','center','bottom'].forEach(p => {
    const btn = document.getElementById(`${fid}-p${p[0]}`);
    if(btn) btn.classList.toggle('active', p===pos);
  });
  applyImageToDoc(fid);
  schedulePreview();
}

// ── Preview ───────────────────────────────────────────────────────────────────
let pvTimer = null;
function schedulePreview() {
  clearTimeout(pvTimer);
  pvTimer = setTimeout(updatePreview, 300);
}

function serializeDoc(doc) {
  // Inject <base> so relative paths (CSS, images) resolve against the file's location.
  // File System Access API gives no file:// path, so we use srcdoc + base instead.
  let html = '<!DOCTYPE html>' + doc.documentElement.outerHTML;
  return html;
}

function updatePreview() {
  if(!curDoc) return;
  const html = serializeDoc(curDoc);
  const iframe = document.getElementById('preview-iframe');
  // Use srcdoc to avoid blob-URL relative-path issues where possible,
  // but srcdoc has a size limit → fall back to blob for large docs (base64 images).
  if(html.length < 2 * 1024 * 1024) {
    iframe.removeAttribute('src');
    iframe.srcdoc = html;
  } else {
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    iframe.removeAttribute('srcdoc');
    iframe.src = url;
    setTimeout(()=>URL.revokeObjectURL(url), 8000);
  }
}

function setPv(mode) {
  const iframe = document.getElementById('preview-iframe');
  iframe.className = mode;
  document.getElementById('pv-pc').classList.toggle('active', mode==='pc');
  document.getElementById('pv-sp').classList.toggle('active', mode==='sp');
}

// ── Page fixes injection (CSS + JS) ───────────────────────────────────────────
function ensureMobileCss(html, fname) {
  const worksExtra = '@media(max-width:768px){.wm-slider{aspect-ratio:16/9;}.wm-body{padding:1.5rem 1.2rem 2.5rem;}.wm-specs{grid-template-columns:1fr 1fr;}.nav-logo{font-size:1.1rem;}}';
  const navLogoOnly = '@media(max-width:768px){.nav-logo{font-size:1.1rem;}}';
  const needed = (fname === 'works.html') ? worksExtra : navLogoOnly;
  const marker = (fname === 'works.html') ? '.wm-slider{aspect-ratio' : '.nav-logo{font-size:1.1rem';
  if(!html.includes(marker)) {
    const idx = html.lastIndexOf('<\/style>');
    if(idx !== -1) html = html.slice(0, idx) + needed + '\n' + html.slice(idx);
  }
  // index.html: works cards click → works.html?id=N
  if(fname === 'index.html' && !html.includes("works.html?id=")) {
    const jsSnippet = `document.querySelectorAll('#works .wk').forEach(function(el,i){el.addEventListener('click',function(){location.href='works.html?id='+i;});});`;
    const closing = html.lastIndexOf('<\/script>');
    if(closing !== -1) html = html.slice(0, closing) + jsSnippet + '\n' + html.slice(closing);
  }
  return html;
}

// ── Save file ─────────────────────────────────────────────────────────────────
async function saveFile() {
  if(!dirHandle) return;
  if(curTab === 'works') { await saveWorks(); return; }
  if(!curDoc) return;
  const fname = FM[curTab];
  if(!fname) return;
  try {
    const html = ensureMobileCss(serializeDoc(curDoc), fname);
    const fh = await dirHandle.getFileHandle(fname, {create:false});
    const writable = await fh.createWritable();
    await writable.write(html);
    await writable.close();
    showToast('保存しました ✓');
  } catch(e) {
    showToast('保存に失敗: ' + e.message, true);
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, isErr=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isErr?' err':'');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.className='', 2500);
}

// ═══════════════════════════════════════════════════════════════════════════════
// WORKS SPECIAL HANDLING
// ═══════════════════════════════════════════════════════════════════════════════

async function loadWorks() {
  const container = document.getElementById('fields-container');
  try {
    const fh = await dirHandle.getFileHandle('works.html');
    const file = await fh.getFile();
    curRaw = await file.text();
    const parser = new DOMParser();
    curDoc = parser.parseFromString(curRaw, 'text/html');
    worksData = extractWorksArr();
    worksImgs = {};
    renderWorksUI();
    updatePreview();
  } catch(e) {
    container.innerHTML = `<div class="field"><p class="field-note">works.htmlを読み込めませんでした: ${e.message}</p></div>`;
  }
}

function extractWorksArr() {
  const scripts = curDoc.querySelectorAll('script');
  for(const s of scripts) {
    const txt = s.textContent;
    const idx = txt.indexOf('const works = [');
    if(idx < 0) continue;
    const ai = txt.indexOf('[', idx);
    let depth=0, i=ai;
    while(i<txt.length) {
      if(txt[i]==='[') depth++;
      else if(txt[i]===']') { depth--; if(!depth) break; }
      i++;
    }
    const arrStr = txt.substring(ai, i+1);
    try { return (new Function('return ' + arrStr))(); } catch(e) { return []; }
  }
  return [];
}

function renderWorksUI() {
  const container = document.getElementById('fields-container');
  if(!worksData || !worksData.length) {
    container.innerHTML = '<div class="field"><p class="field-note">施工例データが見つかりませんでした。</p></div>';
    return;
  }
  let html = '<div class="section-hd">施工例リスト</div>';
  worksData.forEach((w,i) => {
    html += `<div class="wk-accordion" id="wkacc-${i}">
      <div class="wk-acc-hd" onclick="toggleWkAcc(${i})">
        <span>${w.num || (i+1)}. ${w.ttl || '（タイトルなし）'}</span>
        <span class="wk-acc-arrow" id="wkarrow-${i}">▶</span>
      </div>
      <div class="wk-acc-body" id="wkbody-${i}">
        ${renderWorksEntry(w, i)}
      </div>
    </div>`;
  });
  container.innerHTML = html;
}

function renderWorksEntry(w, i) {
  const specs = (w.specs||[]).map((s,si)=>`
    <div class="spec-row" id="wkspec-${i}-${si}">
      <input type="text" placeholder="ラベル" value="${esc(s.label||'')}" onchange="updSpec(${i},${si},'label',this.value)">
      <input type="text" placeholder="値" value="${esc(s.val||'')}" onchange="updSpec(${i},${si},'val',this.value)">
      <input type="text" placeholder="単位" style="width:50px" value="${esc(s.unit||'')}" onchange="updSpec(${i},${si},'unit',this.value)">
      <button class="spec-del" onclick="delSpec(${i},${si})">×</button>
    </div>`).join('');

  const photos = (w.photos||[]).map((p,pi)=>`
    <div class="wk-field" style="margin-bottom:8px;">
      <label>写真${pi+1}</label>
      <div class="wk-img-area ${worksImgs['wi_'+i+'_'+pi]?'has-img':''}" onclick="wkImgUpload(${i},${pi})">
        <img id="wkimg-${i}-${pi}" class="wk-img-preview" style="display:${worksImgs['wi_'+i+'_'+pi]?'block':'none'}" src="${worksImgs['wi_'+i+'_'+pi]||''}">
        <span class="img-hint" style="font-size:10px;color:var(--muted)">${worksImgs['wi_'+i+'_'+pi]?'変更':'クリックして画像を選択'}</span>
      </div>
    </div>`).join('');

  return `
    <div class="wk-field">
      <label>タグ</label>
      <input type="text" value="${esc(w.tag||'')}" onchange="updWk(${i},'tag',this.value)">
    </div>
    <div class="wk-field">
      <label>エリア・場所</label>
      <input type="text" value="${esc(w.location||'')}" onchange="updWk(${i},'location',this.value)">
    </div>
    <div class="wk-field">
      <label>タイトル（和）</label>
      <input type="text" value="${esc(w.ttl||'')}" onchange="updWk(${i},'ttl',this.value)">
    </div>
    <div class="wk-field">
      <label>タイトル（英）</label>
      <input type="text" value="${esc(w.sub||'')}" onchange="updWk(${i},'sub',this.value)">
    </div>
    <div class="wk-field">
      <label>説明文</label>
      <textarea onchange="updWk(${i},'desc',this.value)">${esc(w.desc||'')}</textarea>
    </div>
    <div class="wk-field">
      <label>スペック</label>
      <div id="wkspecs-${i}">${specs}</div>
      <button class="spec-add" onclick="addSpec(${i})">+ スペック追加</button>
    </div>
    <div class="wk-field">
      <label>写真</label>
      ${photos}
      <button class="spec-add" onclick="addWkPhoto(${i})">+ 写真を追加</button>
    </div>`;
}

function toggleWkAcc(i) {
  const body = document.getElementById('wkbody-'+i);
  const arrow = document.getElementById('wkarrow-'+i);
  const open = body.classList.toggle('open');
  arrow.textContent = open ? '▼' : '▶';
}

function updWk(i, key, val) {
  if(!worksData[i]) return;
  worksData[i][key] = val;
  scheduleWorksPreview();
}

function updSpec(i, si, key, val) {
  if(!worksData[i] || !worksData[i].specs) return;
  worksData[i].specs[si][key] = val;
  scheduleWorksPreview();
}

function delSpec(i, si) {
  if(!worksData[i] || !worksData[i].specs) return;
  worksData[i].specs.splice(si, 1);
  document.getElementById('wkspecs-'+i).innerHTML = worksData[i].specs.map((s,sj)=>`
    <div class="spec-row" id="wkspec-${i}-${sj}">
      <input type="text" placeholder="ラベル" value="${esc(s.label||'')}" onchange="updSpec(${i},${sj},'label',this.value)">
      <input type="text" placeholder="値" value="${esc(s.val||'')}" onchange="updSpec(${i},${sj},'val',this.value)">
      <input type="text" placeholder="単位" style="width:50px" value="${esc(s.unit||'')}" onchange="updSpec(${i},${sj},'unit',this.value)">
      <button class="spec-del" onclick="delSpec(${i},${sj})">×</button>
    </div>`).join('');
  scheduleWorksPreview();
}

function addSpec(i) {
  if(!worksData[i]) return;
  if(!worksData[i].specs) worksData[i].specs = [];
  worksData[i].specs.push({label:'', val:'', unit:''});
  const si = worksData[i].specs.length - 1;
  const cont = document.getElementById('wkspecs-'+i);
  const div = document.createElement('div');
  div.className = 'spec-row';
  div.id = `wkspec-${i}-${si}`;
  div.innerHTML = `
    <input type="text" placeholder="ラベル" onchange="updSpec(${i},${si},'label',this.value)">
    <input type="text" placeholder="値" onchange="updSpec(${i},${si},'val',this.value)">
    <input type="text" placeholder="単位" style="width:50px" onchange="updSpec(${i},${si},'unit',this.value)">
    <button class="spec-del" onclick="delSpec(${i},${si})">×</button>`;
  cont.appendChild(div);
}

function wkImgUpload(i, pi) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const dataUrl = ev.target.result;
      const key = 'wi_'+i+'_'+pi;
      worksImgs[key] = dataUrl;
      if(worksData[i]) {
        if(!worksData[i].photos) worksData[i].photos = [];
        if(!worksData[i].photos[pi]) worksData[i].photos[pi] = {src:'', alt:'', gradient:'linear-gradient(135deg,#888,#555)'};
        worksData[i].photos[pi].src = dataUrl;
      }
      const img = document.getElementById(`wkimg-${i}-${pi}`);
      if(img){ img.src=dataUrl; img.style.display='block'; }
      scheduleWorksPreview();
    };
    reader.readAsDataURL(file);
  };
  inp.click();
}

function addWkPhoto(i) {
  if(!worksData[i]) return;
  if(!worksData[i].photos) worksData[i].photos = [];
  const pi = worksData[i].photos.length;
  worksData[i].photos.push({src:'', alt:'', gradient:'linear-gradient(135deg,#6E7A88,#3C4855)'});
  const key = 'wi_'+i+'_'+pi;
  const parent = document.getElementById('wkbody-'+i);
  const btn = parent.querySelector('.spec-add:last-child');
  const div = document.createElement('div');
  div.className = 'wk-field';
  div.style.marginBottom = '8px';
  div.innerHTML = `<label>写真${pi+1}</label>
    <div class="wk-img-area" onclick="wkImgUpload(${i},${pi})">
      <img id="wkimg-${i}-${pi}" class="wk-img-preview" style="display:none" src="">
      <span class="img-hint" style="font-size:10px;color:var(--muted)">クリックして画像を選択</span>
    </div>`;
  btn.parentNode.insertBefore(div, btn);
}

let wkPvTimer = null;
function scheduleWorksPreview() {
  clearTimeout(wkPvTimer);
  wkPvTimer = setTimeout(updateWorksPreview, 400);
}

function updateWorksPreview() {
  if(!curDoc || !worksData) return;

  // Update JS array in script tag
  const scripts = curDoc.querySelectorAll('script');
  for(const s of scripts) {
    if(s.textContent.indexOf('const works = [') >= 0) {
      const txt = s.textContent;
      const idx = txt.indexOf('const works = [');
      const ai = txt.indexOf('[', idx);
      let depth=0, i=ai;
      while(i<txt.length) {
        if(txt[i]==='[') depth++;
        else if(txt[i]===']') { depth--; if(!depth) break; }
        i++;
      }
      const newArr = JSON.stringify(worksData, null, 2);
      s.textContent = txt.substring(0, ai) + newArr + txt.substring(i+1);
      break;
    }
  }

  // Patch card thumbnails: show photos[0] as the card thumbnail image
  worksData.forEach((w, i) => {
    const thumb = curDoc.querySelector(`.wk[data-id="${i}"] .wk-thumb`);
    if(!thumb) return;
    const src = w.photos && w.photos[0] && w.photos[0].src;
    if(src) {
      thumb.innerHTML = `<img class="wk-img" src="${src}" alt="${(w.photos[0].alt)||''}" style="width:100%;height:100%;object-fit:cover;display:block;">`;
    } else {
      // Restore gradient placeholder if no photo
      const grad = w.photos && w.photos[0] && w.photos[0].gradient || 'linear-gradient(145deg,#888,#555)';
      if(!thumb.querySelector('.wk-img-placeholder')) {
        thumb.innerHTML = `<div class="wk-img-placeholder" style="background:${grad};"></div>`;
      }
    }
  });

  updatePreview();
}

async function saveWorks() {
  if(!dirHandle || !curDoc || !worksData) return;
  updateWorksPreview();
  try {
    const html = ensureMobileCss(serializeDoc(curDoc), 'works.html');
    const fh = await dirHandle.getFileHandle('works.html', {create:false});
    const writable = await fh.createWritable();
    await writable.write(html);
    await writable.close();
    showToast('保存しました ✓');
  } catch(e) {
    showToast('保存に失敗: ' + e.message, true);
  }
}
</script>
</body>
</html>

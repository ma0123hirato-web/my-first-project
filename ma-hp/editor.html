<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>株式会社ma HP 編集アプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --mocha: #B8977E; --mocha-d: #9A7A63; --mocha-l: #D4B99E;
  --bg: #FAF8F5; --dark: #2E2A27; --mid: #6B5B4E;
  --soft: #EDE6DC; --border: #D9CFC6; --white: #fff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--dark); font-size: 14px; }

/* ── WELCOME SCREEN ── */
#welcome {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100vh; text-align: center; gap: 1.5rem;
}
#welcome h1 { font-size: 1.3rem; font-weight: 500; color: var(--dark); letter-spacing: 0.08em; }
#welcome p { font-size: 0.85rem; color: var(--mid); line-height: 2; }
#welcome .brand { color: var(--mocha); font-weight: 500; }
.open-btn {
  margin-top: 0.5rem; padding: 0.9rem 2.5rem; background: var(--mocha);
  color: var(--white); border: none; border-radius: 4px; font-family: inherit;
  font-size: 0.95rem; cursor: pointer; letter-spacing: 0.08em; transition: background 0.2s;
}
.open-btn:hover { background: var(--mocha-d); }
#welcome .note {
  font-size: 0.72rem; color: #aaa; max-width: 320px; line-height: 1.8;
  border: 1px solid var(--border); border-radius: 4px; padding: 0.75rem 1rem;
  background: var(--white);
}

/* ── APP LAYOUT ── */
#app { display: none; flex-direction: column; height: 100vh; }
#app.visible { display: flex; }

#app-nav {
  height: 52px; background: var(--dark); color: var(--white); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem;
}
.nav-title { font-size: 0.88rem; letter-spacing: 0.05em; }
.nav-brand { color: var(--mocha-l); margin-right: 0.4rem; }
.nav-folder { font-size: 0.72rem; color: rgba(255,255,255,0.4); margin-left: 0.75rem; }
.nav-actions { display: flex; gap: 0.6rem; }

.btn { cursor: pointer; border: none; font-family: inherit; font-size: 0.8rem; border-radius: 3px; padding: 0.42rem 0.9rem; transition: all 0.2s; letter-spacing: 0.04em; }
.btn-primary { background: var(--mocha); color: var(--white); }
.btn-primary:hover { background: var(--mocha-d); }
.btn-outline { background: transparent; color: var(--white); border: 1px solid rgba(255,255,255,0.3); }
.btn-outline:hover { background: rgba(255,255,255,0.08); }
.btn-ghost { background: transparent; color: var(--mocha-l); font-size: 0.75rem; padding: 0.35rem 0.7rem; text-decoration: underline; }
.btn-ghost:hover { color: var(--white); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

#app-body { display: flex; flex: 1; overflow: hidden; }

/* ── LEFT PANEL ── */
#left-panel {
  width: 400px; min-width: 300px; display: flex; flex-direction: column;
  border-right: 2px solid var(--border); background: var(--white); overflow: hidden;
}
#tab-bar { display: flex; border-bottom: 1px solid var(--border); background: var(--soft); flex-shrink: 0; overflow-x: auto; flex-wrap: nowrap; }
.tab-btn {
  flex: 1; padding: 0.8rem 0.4rem; border: none; background: transparent;
  font-family: inherit; font-size: 0.75rem; color: var(--mid); cursor: pointer;
  border-bottom: 2px solid transparent; transition: all 0.2s; letter-spacing: 0.03em;
}
.tab-btn.active { color: var(--mocha-d); border-bottom-color: var(--mocha); background: var(--white); font-weight: 500; }
.tab-btn:hover:not(.active) { background: rgba(184,151,126,0.08); }

#form-area { flex: 1; overflow-y: auto; padding: 0.75rem 1rem 3rem; }

.sec-label {
  font-size: 0.58rem; letter-spacing: 0.2em; color: var(--mocha); font-weight: 500;
  text-transform: uppercase; padding: 1.1rem 0 0.45rem; border-bottom: 1px solid var(--soft);
  margin-bottom: 0.7rem; display: flex; align-items: center; gap: 0.5rem;
}
.sec-label::before { content: ''; display: block; width: 14px; height: 1px; background: var(--mocha); }

.field-group { margin-bottom: 0.85rem; }
.field-label { display: block; font-size: 0.7rem; color: var(--mid); margin-bottom: 0.28rem; }
.field-input, .field-textarea, .field-url {
  width: 100%; font-family: inherit; font-size: 0.8rem; color: var(--dark);
  background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
  padding: 0.44rem 0.6rem; transition: border-color 0.2s, box-shadow 0.2s; line-height: 1.5;
}
.field-input:focus, .field-textarea:focus, .field-url:focus {
  outline: none; border-color: var(--mocha); background: var(--white);
  box-shadow: 0 0 0 2px rgba(184,151,126,0.15);
}
.field-textarea { resize: vertical; min-height: 64px; }
.field-url { font-size: 0.72rem; font-family: monospace; color: var(--mid); }

.url-row { display: flex; gap: 0.4rem; align-items: center; }
.url-row .field-url { flex: 1; }
.btn-pick-img {
  flex-shrink: 0; padding: 0.44rem 0.7rem; background: var(--soft);
  border: 1px solid var(--border); border-radius: 3px; cursor: pointer;
  font-family: inherit; font-size: 0.72rem; color: var(--mid); white-space: nowrap;
  transition: all 0.2s;
}
.btn-pick-img:hover { background: var(--mocha-l); color: var(--white); border-color: var(--mocha-l); }
.img-preview-thumb {
  width: 100%; height: 60px; object-fit: cover; border-radius: 3px;
  border: 1px solid var(--border); margin-top: 0.3rem; display: none;
}
.img-pos-ctrl {
  display: none; gap: 0.3rem; margin-top: 0.3rem; align-items: center;
}
.img-pos-ctrl span { font-size: 0.68rem; color: var(--mid); }
.btn-pos {
  padding: 0.2rem 0.55rem; font-size: 0.68rem; border: 1px solid var(--border);
  border-radius: 2px; background: var(--soft); cursor: pointer; font-family: inherit;
  color: var(--mid); transition: all 0.15s;
}
.btn-pos:hover, .btn-pos.active { background: var(--mocha); color: var(--white); border-color: var(--mocha); }

.field-label-row {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.28rem;
}
.field-label-row .field-label { margin-bottom: 0; }
.font-size-ctrl {
  display: flex; align-items: center; gap: 0.3rem; flex-shrink: 0;
}
.font-size-ctrl span {
  font-size: 0.65rem; color: var(--mid); min-width: 2.8rem; text-align: center;
  background: var(--soft); border: 1px solid var(--border); border-radius: 2px;
  padding: 0.1rem 0.3rem;
}
.btn-fs {
  width: 22px; height: 22px; border: 1px solid var(--border); border-radius: 2px;
  background: var(--soft); cursor: pointer; font-family: inherit; color: var(--mid);
  display: flex; align-items: center; justify-content: center; font-size: 0.75rem;
  transition: all 0.15s; flex-shrink: 0; padding: 0;
}
.btn-fs:hover { background: var(--mocha); color: var(--white); border-color: var(--mocha); }

.card-toggle-row { display:flex; align-items:center; gap:0.6rem; padding:0.6rem 0 0.4rem; margin-bottom:0.5rem; border-bottom: 1px solid var(--soft); }
.btn-toggle { padding:0.28rem 0.75rem; font-size:0.7rem; border-radius:20px; border:1px solid var(--mocha); background:var(--mocha); color:white; cursor:pointer; font-family:inherit; transition:all 0.2s; }
.btn-toggle.inactive { background:transparent; color:var(--mid); border-color:var(--border); }
.card-toggle-label { font-size:0.75rem; font-weight:500; color:var(--dark); letter-spacing:0.05em; }

.card-box {
  border: 1px solid var(--border); border-radius: 4px;
  padding: 0.7rem 0.8rem 0.3rem; margin-bottom: 0.7rem; background: #FDFBF9;
}
.card-box-title {
  font-size: 0.65rem; font-weight: 500; color: var(--mocha-d);
  margin-bottom: 0.55rem; padding-bottom: 0.35rem; border-bottom: 1px solid var(--soft);
  letter-spacing: 0.06em;
}

/* ── RIGHT PANEL ── */
#right-panel { flex: 1; display: flex; flex-direction: column; background: #E8E4DC; overflow: hidden; }
#preview-bar {
  display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0.9rem;
  background: rgba(42,37,32,0.06); border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#preview-label { font-size: 0.65rem; color: var(--mid); letter-spacing: 0.1em; flex: 1; text-transform: uppercase; }
.btn-preview { background: var(--mocha); color: var(--white); font-size: 0.73rem; padding: 0.32rem 0.9rem; }
.btn-preview:hover { background: var(--mocha-d); }
#preview-frame { flex: 1; width: 100%; border: none; background: var(--white); }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 1.5rem; right: 1.5rem; padding: 0.7rem 1.2rem;
  background: var(--dark); color: var(--white); border-radius: 4px; font-size: 0.8rem;
  opacity: 0; transform: translateY(8px); transition: all 0.25s;
  pointer-events: none; z-index: 999; max-width: 300px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.ok { background: #2E7D32; }
#toast.ng { background: #C62828; }

@media (max-width: 860px) {
  #app-body { flex-direction: column; }
  #left-panel { width: 100%; min-width: unset; height: 55vh; border-right: none; border-bottom: 2px solid var(--border); }
  #right-panel { height: 45vh; }
}
</style>
</head>
<body>

<!-- ── WELCOME ── -->
<div id="welcome">
  <h1><span class="brand">株式会社ma</span> HP 編集アプリ</h1>
  <p>ma-hp フォルダを選択すると<br>ホームページを編集できます</p>
  <button class="open-btn" onclick="openFolder()">📁 ma-hp フォルダを開く</button>
  <div class="note">
    ※ Chrome または Edge で開いてください<br>
    ※ ファイルの保存許可を求められたら「許可」を押してください
  </div>
</div>

<!-- ── APP ── -->
<div id="app">
  <nav id="app-nav">
    <div class="nav-title">
      <span class="nav-brand">株式会社ma</span>HP 編集アプリ
      <span class="nav-folder" id="folder-name"></span>
    </div>
    <div class="nav-actions">
      <button class="btn btn-ghost" onclick="downloadFile()">ダウンロード</button>
      <button class="btn btn-outline" onclick="updatePreview()">▶ プレビュー更新</button>
      <button class="btn btn-primary" onclick="saveFile()">💾 保存</button>
    </div>
  </nav>

  <div id="app-body">
    <div id="left-panel">
      <div id="tab-bar">
        <button class="tab-btn active" onclick="switchTab('index', this)">トップページ</button>
        <button class="tab-btn" onclick="switchTab('nini', this)">ni-ni</button>
        <button class="tab-btn" onclick="switchTab('event', this)">イベント</button>
        <button class="tab-btn" onclick="switchTab('news', this)">お知らせ</button>
        <button class="tab-btn" onclick="switchTab('events', this)">イベント一覧</button>
        <button class="tab-btn" onclick="switchTab('works', this)">施工例</button>
        <button class="tab-btn" onclick="switchTab('service', this)">サービス</button>
        <button class="tab-btn" onclick="switchTab('news-1', this)">お知らせ①</button>
        <button class="tab-btn" onclick="switchTab('news-2', this)">お知らせ②</button>
        <button class="tab-btn" onclick="switchTab('news-3', this)">お知らせ③</button>
        <button class="tab-btn" onclick="switchTab('event-1', this)">イベント①</button>
        <button class="tab-btn" onclick="switchTab('event-2', this)">イベント②</button>
        <button class="tab-btn" onclick="switchTab('event-3', this)">イベント③</button>
        <button class="tab-btn" onclick="switchTab('works-detail', this)">施工例詳細</button>
      </div>
      <div id="form-area"></div>
    </div>
    <div id="right-panel">
      <div id="preview-bar">
        <span id="preview-label">Preview</span>
        <button class="btn btn-preview" onclick="updatePreview()">▶ プレビュー更新</button>
      </div>
      <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── STATE ──
let dirHandle = null;
let fileHandles = {};
let currentTab = 'index';
let htmlDocs = {};   // parsed DOM per tab
let blobUrl = null;

const FILE_MAP = {
  index: 'index.html', nini: 'nini.html', event: 'event-modelhouse.html',
  news: 'news.html', events: 'events.html', works: 'works.html', service: 'service.html',
  'news-1': 'news-1.html', 'news-2': 'news-2.html', 'news-3': 'news-3.html',
  'event-1': 'event-1.html', 'event-2': 'event-2.html', 'event-3': 'event-3.html',
  'works-detail': 'works-detail.html'

// ── FIELD DEFINITIONS ──
// Each field: { id, label, selector, prop, type, nth }

// ── FOLDER OPEN ──
async function openFolder() {
  if (!window.showDirectoryPicker) {
    alert('この機能は Chrome または Edge が必要です。\nInternet Explorer や Firefox では動作しません。');
    return;
  }
  try {
    dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    document.getElementById('folder-name').textContent = dirHandle.name;

    // Get file handles
    for (const [tab, fname] of Object.entries(FILE_MAP)) {
      try {
        fileHandles[tab] = await dirHandle.getFileHandle(fname);
      } catch {
        fileHandles[tab] = null;
      }
    }

    document.getElementById('welcome').style.display = 'none';
    document.getElementById('app').classList.add('visible');

    await loadTab('index');
  } catch (e) {
    if (e.name !== 'AbortError') alert('フォルダを開けませんでした: ' + e.message);
  }
}

// ── LOAD TAB ──
async function loadTab(tab) {
  currentTab = tab;
  const fh = fileHandles[tab];
  if (!fh) { showToast('ファイルが見つかりません', 'ng'); return; }

  const file = await fh.getFile();
  const text = await file.text();
  const parser = new DOMParser();
  htmlDocs[tab] = parser.parseFromString(text, 'text/html');

  renderForm(tab);
  refreshPreview(tab);
}

// ── RENDER FORM ──
function renderForm(tab) {
  const fields = FIELDS[tab];
  const doc = htmlDocs[tab];
  let html = '';

  for (const f of fields) {
    if (f.sec !== undefined) {
      html += `<div class="sec-label">${f.sec}</div>`;
      continue;
    }

    if (f.type === 'toggle') {
      const elements = doc.querySelectorAll(f.cardSelector);
      const el = (f.nth !== null && f.nth !== undefined) ? elements[f.nth] : elements[0];
      const isHidden = el && el.style.display === 'none';
      const activeCls = isHidden ? 'inactive' : '';
      const btnText = isHidden ? '○ 非公開' : '● 公開中';
      const nthVal = f.nth !== undefined ? f.nth : 'null';
      const safeSelector = f.cardSelector.replace(/"/g, '&quot;');
      html += `<div class="card-toggle-row">
        <button class="btn-toggle ${activeCls}" id="toggle-${f.id}" onclick="toggleCard('${safeSelector}',${nthVal},'${f.id}')">${btnText}</button>
        <span class="card-toggle-label">${f.label}</span>
      </div>`;
      continue;
    }

    const elements = doc.querySelectorAll(f.selector);
    const el = (f.nth !== undefined) ? elements[f.nth] : elements[0];
    let val = '';
    let missing = !el;

    if (el) {
      if (f.prop === 'bgUrl') {
        const s = el.style.backgroundImage || '';
        val = s.replace(/^url\(['"]?/, '').replace(/['"]?\)$/, '');
      } else if (f.prop === 'src') {
        val = el.getAttribute('src') || '';
      } else {
        val = el.textContent.trim();
      }
    }

    const cls = missing ? ' style="opacity:0.45"' : '';
    const missingNote = missing ? '<div style="font-size:0.68rem;color:#bbb;font-style:italic;margin-top:2px">※ 要素が見つかりません（保存時スキップ）</div>' : '';

    const inputCls = f.type === 'url' ? 'field-url' : (f.type === 'textarea' ? 'field-textarea' : 'field-input');
    const escaped = val.replace(/&/g,'&amp;').replace(/"/g,'&quot;');

    // 文字サイズ取得
    const isText = (f.type === 'textarea' || f.type === 'input') && f.prop === 'textContent';
    let fsPx = '';
    if (isText && el) {
      const inlineFs = el.style.fontSize;
      fsPx = inlineFs ? parseFloat(inlineFs) : '';
    }
    const fsDisplay = fsPx !== '' ? fsPx + 'px' : '—';
    const fsSizeCtrl = isText && !missing ? `
      <div class="font-size-ctrl">
        <button class="btn-fs" onclick="changeFontSize('${f.id}','${f.selector}',${f.nth??'null'},-1)" title="小さく">A−</button>
        <span id="fs-${f.id}">${fsDisplay}</span>
        <button class="btn-fs" onclick="changeFontSize('${f.id}','${f.selector}',${f.nth??'null'},1)" title="大きく">A+</button>
      </div>` : '';

    html += `<div class="field-group">
      <div class="field-label-row">
        <label class="field-label"${cls}>${f.label}</label>
        ${fsSizeCtrl}
      </div>`;

    if (f.type === 'textarea') {
      const escapedTA = val.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      html += `<textarea class="${inputCls}" id="f-${f.id}" rows="3">${escapedTA}</textarea>`;
    } else if (f.type === 'url') {
      const thumbSrc = (val && !val.startsWith('linear-gradient')) ? val : '';
      const thumbStyle = thumbSrc ? 'display:block' : 'display:none';
      const posStyle = thumbSrc ? 'display:flex' : 'display:none';
      const safeSelector = f.selector.replace(/"/g, '&quot;');
      const nthVal = f.nth ?? 'null';
      html += `<div class="url-row">
        <input class="${inputCls}" id="f-${f.id}" type="text" value="${escaped}" oninput="onUrlInput('${f.id}')">
        <button class="btn-pick-img" data-fid="${f.id}" data-sel="${safeSelector}" data-nth="${nthVal}" onclick="pickImage(this.dataset.fid,this.dataset.sel,this.dataset.nth==='null'?null:+this.dataset.nth)">📷 写真を選ぶ</button>
      </div>
      <img id="thumb-${f.id}" class="img-preview-thumb" src="${thumbSrc}" style="${thumbStyle}" alt="">
      <div id="pos-${f.id}" class="img-pos-ctrl" style="${posStyle}">
        <span>表示位置：</span>
        <button class="btn-pos" data-fid="${f.id}" data-sel="${safeSelector}" data-nth="${nthVal}" data-pos="top" onclick="setImgPos(this.dataset.fid,this.dataset.sel,this.dataset.nth==='null'?null:+this.dataset.nth,this.dataset.pos)">上</button>
        <button class="btn-pos active" data-fid="${f.id}" data-sel="${safeSelector}" data-nth="${nthVal}" data-pos="center" onclick="setImgPos(this.dataset.fid,this.dataset.sel,this.dataset.nth==='null'?null:+this.dataset.nth,this.dataset.pos)">中央</button>
        <button class="btn-pos" data-fid="${f.id}" data-sel="${safeSelector}" data-nth="${nthVal}" data-pos="bottom" onclick="setImgPos(this.dataset.fid,this.dataset.sel,this.dataset.nth==='null'?null:+this.dataset.nth,this.dataset.pos)">下</button>
      </div>`;
    } else {
      html += `<input class="${inputCls}" id="f-${f.id}" type="text" value="${escaped}">`;
    }
    html += missingNote + '</div>';
  }

  document.getElementById('form-area').innerHTML = html;
}

// ── APPLY FORM → DOM ──
function applyForm(tab) {
  const fields = FIELDS[tab];
  const doc = htmlDocs[tab];

  for (const f of fields) {
    if (f.sec !== undefined) continue;
    if (f.type === 'toggle') continue;
    const input = document.getElementById('f-' + f.id);
    if (!input) continue;
    const val = input.value;

    const elements = doc.querySelectorAll(f.selector);
    const el = (f.nth !== undefined) ? elements[f.nth] : elements[0];
    if (!el) continue;

    if (f.prop === 'bgUrl') {
      if (val.trim()) {
        el.style.backgroundImage = `url('${val}')`;
        el.style.backgroundSize = 'cover';
        if (!el.style.backgroundPosition) el.style.backgroundPosition = 'center';
      }
    } else if (f.prop === 'src') {
      el.setAttribute('src', val);
    } else {
      el.textContent = val;
    }
  }
}

// ── PREVIEW ──
function refreshPreview(tab) {
  const doc = htmlDocs[tab];
  if (!doc) return;
  const html = '<!DOCTYPE html>' + doc.documentElement.outerHTML;
  if (blobUrl) URL.revokeObjectURL(blobUrl);
  blobUrl = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  document.getElementById('preview-frame').src = blobUrl;
  document.getElementById('preview-label').textContent = FILE_MAP[tab] + ' — プレビュー';
}

function updatePreview() {
  applyForm(currentTab);
  refreshPreview(currentTab);
}

// ── FONT SIZE ──
function changeFontSize(fieldId, selector, nth, delta) {
  const doc = htmlDocs[currentTab];
  if (!doc) return;
  const elements = doc.querySelectorAll(selector);
  const el = (nth !== null && nth !== undefined) ? elements[nth] : elements[0];
  if (!el) return;

  // 現在のフォントサイズを取得（inline style優先、なければ16px基準）
  let cur = parseFloat(el.style.fontSize);
  if (isNaN(cur)) {
    // inline styleがなければ16pxから始める
    cur = 16;
  }
  const next = Math.max(8, Math.min(120, cur + delta));
  el.style.fontSize = next + 'px';

  // 表示更新
  const fsSpan = document.getElementById('fs-' + fieldId);
  if (fsSpan) fsSpan.textContent = next + 'px';

  // プレビュー自動更新
  refreshPreview(currentTab);
}

// ── IMAGE PICK ──
function pickImage(fieldId, selector, nth) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = ev.target.result;
      const urlInput = document.getElementById('f-' + fieldId);
      if (urlInput) urlInput.value = dataUrl;
      const thumb = document.getElementById('thumb-' + fieldId);
      if (thumb) { thumb.src = dataUrl; thumb.style.display = 'block'; }
      const posCtrl = document.getElementById('pos-' + fieldId);
      if (posCtrl) posCtrl.style.display = 'flex';
      // DOMに即反映
      if (selector) applyImgToDom(dataUrl, selector, nth, 'center');
      refreshPreview(currentTab);
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function applyImgToDom(val, selector, nth, pos) {
  const doc = htmlDocs[currentTab];
  if (!doc) return;
  const elements = doc.querySelectorAll(selector);
  const el = (nth !== null && nth !== undefined) ? elements[nth] : elements[0];
  if (!el) return;
  if (el.tagName === 'IMG') {
    el.setAttribute('src', val);
  } else {
    el.style.backgroundImage = val ? `url('${val}')` : '';
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = pos || 'center';
  }
}

function setImgPos(fieldId, selector, nth, pos) {
  const doc = htmlDocs[currentTab];
  if (!doc) return;
  const elements = doc.querySelectorAll(selector);
  const el = (nth !== null && nth !== undefined) ? elements[nth] : elements[0];
  if (!el) return;
  el.style.backgroundPosition = pos;
  // ボタンのactive状態を更新
  const posCtrl = document.getElementById('pos-' + fieldId);
  if (posCtrl) {
    posCtrl.querySelectorAll('.btn-pos').forEach(b => b.classList.remove('active'));
    const labels = { top:'上', center:'中央', bottom:'下' };
    [...posCtrl.querySelectorAll('.btn-pos')].find(b => b.textContent === labels[pos])?.classList.add('active');
  }
  refreshPreview(currentTab);
}

function onUrlInput(fieldId) {
  const urlInput = document.getElementById('f-' + fieldId);
  const thumb = document.getElementById('thumb-' + fieldId);
  if (!thumb || !urlInput) return;
  const val = urlInput.value.trim();
  if (val && !val.startsWith('linear-gradient')) {
    thumb.src = val;
    thumb.style.display = 'block';
  } else {
    thumb.style.display = 'none';
  }
}

// ── SAVE ──
async function saveFile() {
  const fh = fileHandles[currentTab];
  if (!fh) { showToast('ファイルハンドルがありません', 'ng'); return; }

  applyForm(currentTab);

  try {
    const writable = await fh.createWritable();
    const doc = htmlDocs[currentTab];
    const html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
    await writable.write(html);
    await writable.close();
    showToast('✓ 保存しました — ' + FILE_MAP[currentTab], 'ok');
  } catch (e) {
    showToast('保存に失敗しました: ' + e.message, 'ng');
  }
}

// ── DOWNLOAD ──
function downloadFile() {
  applyForm(currentTab);
  const doc = htmlDocs[currentTab];
  if (!doc) return;
  const html = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = FILE_MAP[currentTab];
  a.click();
}

// ── TAB SWITCH ──
async function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (!htmlDocs[tab]) {
    await loadTab(tab);
  } else {
    currentTab = tab;
    renderForm(tab);
    refreshPreview(tab);
  }
}

// ── TOGGLE CARD ──
function toggleCard(selector, nth, toggleId) {
  const doc = htmlDocs[currentTab];
  if (!doc) return;
  const elements = doc.querySelectorAll(selector);
  const el = (nth !== null && nth !== undefined) ? elements[nth] : elements[0];
  if (!el) return;
  const btn = document.getElementById('toggle-' + toggleId);
  if (el.style.display === 'none') {
    el.style.display = '';
    btn.textContent = '● 公開中';
    btn.classList.remove('inactive');
  } else {
    el.style.display = 'none';
    btn.textContent = '○ 非公開';
    btn.classList.add('inactive');
  }
  refreshPreview(currentTab);
}

// ── TOAST ──
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 2800);
}
